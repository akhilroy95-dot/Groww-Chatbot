# Source registry for the Groww MF Facts Assistant.
#
# 21 public URLs: 5 core (indexed), 9 support (indexed), 7 citation-only.
# Anything not listed here cannot be fetched, embedded, or cited.
#
# HDFC Mutual Fund pages return 403 to automated clients. They are citation-only:
# never fetched, never retried, and bot controls are never bypassed.

version: 1

allowlist_domains:
  - groww.in
  - hdfcfund.com
  - files.hdfcfund.com
  - amfiindia.com
  - sebi.gov.in
  - investor.sebi.gov.in
  - camsonline.com

